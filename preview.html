
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret File 022</title>
<style>
* { box-sizing:border-box }
body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#080d0a;
  color:#83e6a4;
  font-family:monospace;
  overflow:hidden;
}
body:before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    transparent 0px,transparent 3px,
    #ffffff08 4px
  );
}
.card {
  width:min(90%,520px);
  padding:35px 22px;
  border:1px solid #397a50;
  box-shadow:0 0 35px #36bd6540;
  text-align:center;
  animation:appear 1.5s ease;
}
.status {
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:40px;
}
h1 {
  font-size:clamp(25px,7vw,38px);
  text-shadow:0 0 15px #83e6a4;
}
.heart {
  font-size:42px;
  margin:25px;
  animation:pulse 1.5s infinite;
}
.message {
  color:#f4e8dc;
  font-family:Georgia,serif;
  font-size:clamp(22px,5vw,30px);
  line-height:1.6;
}
.footer {
  margin-top:45px;
  font-size:11px;
  letter-spacing:3px;
}
@keyframes pulse {
  50% {transform:scale(1.2)}
}
@keyframes appear {
  from {opacity:0;transform:translateY(20px)}
  to {opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>
<main class="card">
  <div class="status">● ACCESS GRANTED · FILE 022</div>

  <h1>¡LO HAS ENCONTRADO!</h1>

  <div class="heart">♡</div>

  <div class="message">
    Te amo mucho,<br>
    ¿sabías?<br><br>
    Feliz cumpleaños,<br>
    mi vida. ❤️
  </div>

  <div class="footer">END OF TRANSMISSION_</div>
</main>
</body>
</html>
